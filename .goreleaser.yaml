version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: maestro
    binary: maestro
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X maestro-cli/cmd.Version={{.Version}}

archives:
  - id: maestro
    ids: [maestro]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: gustaleitcor
    name: maestro-cli

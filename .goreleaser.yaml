version: 2

before:
  hooks:
    - go mod tidy
    # The shell completions the Linux packages install, from the CLI itself.
    - sh -c "mkdir -p completions && for sh in bash fish zsh; do go run . completion $sh > completions/maestro.$sh; done"

builds:
  - id: maestro
    binary: maestro
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X maestro-cli/cmd.Version={{.Version}}

archives:
  - id: maestro
    ids: [maestro]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

# Packages for Linux distributions, of the same static binary: deb (Debian,
# Ubuntu, Mint, Pop!_OS), rpm (Fedora, RHEL, Rocky, Alma, openSUSE), apk
# (Alpine) and pkg.tar.zst (Arch, Manjaro, EndeavourOS). Each puts maestro
# in /usr/bin and its completions where each shell looks for them.
nfpms:
  - id: maestro
    ids: [maestro]
    package_name: maestro
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/gustaleitcor/maestro-cli
    maintainer: gustaleitcor <gustaleitcor@users.noreply.github.com>
    description: |-
      Command line for Maestro: build repositories into images and run their
      lines on the lab's machines, and follow them.
    section: utils
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    contents:
      - src: ./completions/maestro.bash
        dst: /usr/share/bash-completion/completions/maestro
        file_info:
          mode: 0644
      - src: ./completions/maestro.fish
        dst: /usr/share/fish/vendor_completions.d/maestro.fish
        file_info:
          mode: 0644
      - src: ./completions/maestro.zsh
        dst: /usr/share/zsh/site-functions/_maestro
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: gustaleitcor
    name: maestro-cli
